name: サイトの公開

# 画面のファイル（public/ の中）やページのひな形を変えてプッシュしたときに、
# サイトを組み立て直して Cloudflare Pages に公開する。
# 価格の自動更新による公開は「買取価格の更新」の中で行っている。
on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "scraper/build.py"
      - "scraper/templates.py"
      - "scraper/common.py"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # 組み立てには標準ライブラリしか使わないので、pip install は不要
      - run: python -m scraper.build

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=kaitori-radar --branch=main
