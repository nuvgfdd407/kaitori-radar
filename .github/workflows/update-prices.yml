name: 買取価格の更新

on:
  schedule:
    # GitHub Actions の時刻は UTC。日本時間は +9 時間
    - cron: "*/15 1-11 * * *"   # 日本時間 10:00〜20:45 に15分ごと
    - cron: "0 12 * * *"        # 日本時間 21:00
  workflow_dispatch:            # Actions の画面から手動でも実行できる

permissions:
  contents: write

# 前の実行や画像の更新が終わる前に次が始まっても、同時には動かさない
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - id: update
        run: python -m scraper.update

      # 価格や取得状況が変わったときだけコミットする
      - if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/prices.json reports/unmatched.json
          git commit -m "買取価格を更新"
          git push
