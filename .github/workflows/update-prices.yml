name: 買取価格の更新

on:
  schedule:
    # GitHub Actions の時刻は UTC。日本時間は +9 時間
    # 毎時0分・15分・30分・45分は GitHub 全体が混んで実行が遅れたり飛ばされたりするので、7分ずらしている
    - cron: "7,22,37,52 1-11 * * *"   # 日本時間 10:07〜20:52 に15分ごと
  workflow_dispatch:            # Actions の画面から手動でも実行できる

permissions:
  contents: write

# 前の実行や画像の更新が終わる前に次が始まっても、同時には動かさない
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - id: update
        run: python -m scraper.update

      # 価格や取得状況が変わったときだけコミットする
      - if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/prices.json reports/unmatched.json
          git commit -m "買取価格を更新"
          git push

      # 価格が変わったときだけ、サイトを組み立て直して Cloudflare Pages に公開する
      # （この実行が作ったコミットでは他のワークフローが動かないので、ここで公開まで行う）
      - if: steps.update.outputs.changed == 'true'
        run: python -m scraper.build

      - if: steps.update.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=kaitori-radar --branch=main
