name: 商品画像の更新

# 毎日 日本時間 9:50（価格の確認が始まる前）に、Cloudflare の Worker（trigger/）が開始する
on:
  workflow_dispatch:            # 商品を追加したときは Actions の画面から手動でも実行できる

permissions:
  contents: write

# 価格の更新と同時には動かさない
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - id: images
        run: python -m scraper.images
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}

      # 画像が変わったときだけコミットする（ページへの反映は次の価格の更新時）
      - if: steps.images.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/images.json
          git commit -m "商品画像を更新"
          git pull --rebase   # 実行中に手元からのプッシュなどがあっても、その上に積む
          git push
